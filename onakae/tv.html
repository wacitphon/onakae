<!DOCTYPE html>
<html>

    <head>
        <base target="_top">
        <title>QUEUE</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/js/bootstrap.bundle.min.js"></script>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"
            integrity="sha384-SR1sx49pcuLnqZUnnPwx6FCym0wLsk5JZuNx2bPPENzswTNFaQU1RDvt3wT4gWFG" crossorigin="anonymous">
            </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.min.js"
            integrity="sha384-j0CNLUeiqtyaRmlzUHCPZ+Gy5fQu0dQ6eZ/xAww941Ai1SxSY+0EQqNXNE6DZiVc" crossorigin="anonymous">
            </script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <style>
            .responsiveRapper {
                overflow: hidden;
                padding-bottom: 56.25%;
                padding-top: 30px;
                height: 0;
                position: relative;
            }

            .responsiveRapper iframe,
            .responsiveRapper object,
            .responsiveRapper embed {
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                position: absolute;
            }



            .fill-span {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>

    <body style="display:block; width:100%;  padding: 20px;" onload="requestFullScreen()">

        <div style="width: 100%; padding:20px">
            <div style="display:block; width:100%; ">

                <div style="width:60%;  display: inline-block;padding: 5px;">

                    <div id="tvdisplay"></div>



                </div>
                <!-- <div style="float: left; " onclick="openFullscreen();">
                    <h1 style="color: #2874A6">รายชื่อรอรับยา</h1>
                </div> -->
                <div style="width:40%; float: left; display: inline-block;">
                    <div class="responsiveRapper" style="margin-top: 5px;">
                        <div id="video">
                            <div id="video">

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script>


            document.addEventListener('DOMContentLoaded', function () {
                openvideo();
            });

            var elem = document.documentElement;
            elem.addEventListener("keyup", function (event) {
                if (event.keyCode === 27) {
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen();
                    }
                }

            })

            $(document).ready(function () {


                setInterval(function () {

                    $.ajax({
                        url: 'tvupdate.php',
                        method: 'POST',
                        success: function (data) {
                            $('#tvdisplay').html(data);
                        }
                    });
                }, 2000);
            });


            function requestFullScreen() {
                var elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                }
            }

            function openvideo() {

                $.ajax({
                    url: 'tvyoutube.php',
                    dataType: "json",
                    success: function (data) {
                        var video_id = data[0].video_id
                        let videoDiv = document.getElementById('video');
                        videoDiv.innerHTML =video_id;                      
                    }
                });


            }


        </script>

    </body>

</html>
