        <script>
            document.addEventListener('DOMContentLoaded', function () {
                getptcallchanel();
                getchanel();
                $("#txtUsername").focus();
            });

            $(document).ready(function () {

                $('#txtUsername').on('keypress', function (event) {
                    if (event.which === 13) {
                        // event.preventDefault();
                        $('#txtPassword').focus();
                        $('#txtPassword').select();
                        // alert($(this).val());
                        // alert(pwd);
                        // alert(chanel);
                    }
                });

                $('#txtPassword').on('keypress', function (event) {
                    if (event.which === 13) {

                        // event.preventDefault();
                        $('#Chanelname').focus();

                        $('#Chanelname').select();
                        // alert($(this).val());
                    }
                });

                $('#Chanelname').on('keypress', function (event) {
                    if (event.which === 13) {
                        checkuserlogin();

                    }
                });


                $('#login').on('click', function () {

                    checkuserlogin();


                });


            });



            function getptcallchanel() {
                $.ajax({
                    url: 'getptcallchanel.php',
                    dataType: "json",
                    success: function (data) {
                        // console.log(data)
                        // $('#Chanelname').val(data[0].chanel);
                        $('#ptcall').val(data[0].chanel);
                    }
                });

            }
            function getYoutubeclip() {
                return new Promise(function (resolve, reject) {
                    $.ajax({
                        url: 'tvyoutube.php',
                        dataType: 'json',
                        success: function (data) {
                            if (data.length > 0) {
                                resolve(data[0].video_id);
                            } else {
                                resolve('<iframe width="560" height="315" src="https://www.youtube.com/embed/9scnDD8-1T4?si=T3meL6Fwmf4B2tPY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>');
                            }
                        },
                        error: function () {
                            reject('เกิดข้อผิดพลาดในการดึงข้อมูลจากเซิร์ฟเวอร์');
                        }
                    });
                });
            }


            function getchanel() {

                $.ajax({
                    url: 'getchanel.php',
                    // method: 'POST', // เปลี่ยน method เป็น 'POST'
                    // data: { hn: searchText },
                    dataType: "json",
                    success: function (data) {
                        // console.log(data)
                        $('#Chanelname').val(data[0].chanel);
                        $('#print_server').val(data[0].print_server);
                        // $('#ptcall').val(data[0].ptcall);

                    }
                });

            }

            function checkuserlogin() {

                var usr = $('#txtUsername').val();
                var pwd = $('#txtPassword').val();
                var chanelname = $('#Chanelname').val();
                var print_server = $('#print_server').val();
                var ptcall = $('#ptcall').val();
                if (print_server === '') {
                    print_server = 'OPD';
                }

                // alert(print_server)

                if (usr == '') {
                    alert('Username ห้ามว่าง');
                    $('#txtUsername').focus();
                } else if (pwd == '') {
                    alert('Password ห้ามว่าง');
                    $('#txtPassword').focus();
                } else if (chanelname == '') {
                    alert('ช่องจ่ายยาห้ามว่าง');
                    $('#Chanelname').focus();
                } else {

                    $.ajax({
                        url: 'getlogin.php',
                        method: 'GET',
                        data: { username: usr, password: pwd, chanel: chanelname },
                        success: function (data) {
                            // Assuming that the response from getlogin.php is a JSON object
                            if (data.length > 0) {


                                var fullname = data[0].name;
                                localStorage.setItem('fullname', fullname);
                                localStorage.setItem('chanel', chanelname);
                                localStorage.setItem('print_server', print_server);
                                localStorage.setItem('ptcall', ptcall);

                                window.location.href = 'index.html';


                            } else {

                                alert('เข้าสู่ระบบไม่สำเร็จ');
                            }
                        }
                        ,
                        error: function (xhr, status, error) {
                            console.error(error);
                            // alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');

                            localStorage.setItem('fullname', usr);
                            localStorage.setItem('chanel', chanelname);
                            localStorage.setItem('print_server', print_server);
                            localStorage.setItem('ptcall', '');
                            window.location.href = 'index.html';
                        }
                    });
                }
            }

            function toggleMicrophone() {

                // var pcall = '0';
                // var pcall = ptcall1;
                var microphoneIcon = document.getElementById("microphone-icon");
                Swal.fire({
                    title: 'การตั้งค่าเชื่อมต่อเครื่องเสียง \nต้องการให้เครื่องนี้เป็นเครื่องสำหรับออกเสียงเรียกรับยา?',
                    showDenyButton: true,
                    // showCancelButton: true,
                    confirmButtonText: 'ต้องการ',
                    denyButtonText: `ไม่ต้องการ`,
                }).then((result) => {

                    if (result.isConfirmed) {
                        // Swal.fire('Saved!', '', 'success')
                        $.ajax({
                            method: 'POST',
                            data: { ptcall: '1' },
                            url: "updateptcall.php",
                            success: function (data) {
                                // window.location = window.location.href;
                            }
                        });
                        microphoneIcon.className = "fa fa-microphone";
                        // $('#txtPtcall').val('1');

                    } else if (result.isDenied) {
                        $.ajax({
                            method: 'POST',
                            data: { ptcall: '0' },
                            url: "updateptcall.php",
                            success: function (data) {
                                // window.location = window.location.href;
                            }
                        });
                        microphoneIcon.className = "fa fa-microphone-slash";
                        // $('#txtPtcall').val('0');
                        //   Swal.fire('Changes are not saved', '', 'info')
                    }
                })


                // $.ajax({
                //     method: 'POST',
                //     data: { ptcall: pcall },
                //     url: "updateptcall.php",
                //     success: function (data) {
                //         // window.location = window.location.href;
                //     }
                // });

            }

            async function showClipYoutube() {
                videoid = getYoutubeclip();

                const { value: text } = await Swal.fire({
                    input: 'textarea',
                    inputLabel: 'Message',
                    inputValue: videoid,
                    inputPlaceholder: 'Type your message here...',
                    inputAttributes: {
                        'aria-label': 'Type your message here'
                    },
                    showCancelButton: true
                })

                if (text) {
                    Swal.fire(text)
                }
            }

            function selectChanel() {
                var pttcall = $('#ptcall').val();
                Swal.fire({
                    title: 'ตั้งค่าเชื่อมต่อเครื่องเสียง \nเลือกเครื่อง PC หรือช่องจ่ายยา สำหรับเชื่อมต่อออกลำโพง?',
                    input: 'select',
                    inputOptions: {
                        '1': 'ช่องจ่ายยา 1',
                        '2': 'ช่องจ่ายยา 2',
                        '3': 'ช่องจ่ายยา 3',
                        '4': 'ช่องจ่ายยา 4',
                        '5': 'ช่องจ่ายยา 5',
                        '6': 'ช่องจ่ายยา 6',
                        '7': 'ช่องจ่ายยา 7',
                        '8': 'ช่องจ่ายยา 8',
                        '9': 'ช่องจ่ายยา 9',
                        '10': 'ช่องจ่ายยา 10'
                    },

                    inputValue: pttcall,
                    showCancelButton: true,
                    cancelButtonText: 'ยกเลิก',
                    confirmButtonText: 'ตกลง',
                    preConfirm: (selectedValue) => {
                        // เรียกใช้งานฟังก์ชันที่คุณต้องการทำต่อ
                        // alert(selectedValue);
                        $.ajax({
                            method: 'POST',
                            data: { chanel: selectedValue },
                            url: "updateptcall2.php",
                            success: function (data) {
                                // หากคุณต้องการดำเนินการอื่น ๆ หลังจากที่ค่าถูกเลือกแล้วในการเรียกใช้ Ajax
                            }
                        });
                    }
                });

            }


        </script>
